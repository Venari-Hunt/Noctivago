appId: com.jltmdesign.noctivago
productName: Noctívago
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
asarUnpack:
  - node_modules/ffmpeg-static/**
extraResources:
  - from: plugins
    to: plugins
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: joaovenari
  repo: Noctivago
  private: true
  # electron-builder defaults to leaving published releases as GitHub
  # drafts, which GitHub's own /releases/latest API (what electron-updater
  # calls to check for updates) silently excludes - the release and its
  # assets are visible on the web UI to the owner, but the update check
  # gets back a 404 as if nothing existed at all. releaseType: release
  # auto-publishes instead of drafting, so update checks can actually see it.
  releaseType: release
