name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --ignore-scripts: the tests here are pure logic (no ffmpeg/yt-dlp
      # binary needed), so skip those downloads entirely for a faster, less
      # network-flaky run.
      - run: npm ci --ignore-scripts

      # Electron downloads itself on first use. Done once here: when the
      # parallel test files did it at the same moment, they collided
      # unpacking it ("The file exists", "Access is denied"; 2026-10-18).
      - run: npx install-electron --no

      - run: npm test
