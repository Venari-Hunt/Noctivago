name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # electron-builder uploads the NSIS installer and its .blockmap as two
      # separate files in parallel, and each one independently checks
      # "does the GitHub release for this tag exist yet, if not create it."
      # When the release doesn't exist yet, both checks can land at the same
      # instant and both try to create it - GitHub accepts the first and
      # 422s the second ("already_exists"), which either kills the whole
      # publish step (losing whichever upload hadn't finished) or, worse,
      # silently drops that upload while electron-builder still exits 0.
      # Pre-creating the release here removes the race entirely: by the time
      # electron-builder's uploads run, the release unambiguously already
      # exists, so both just attach their file to it instead of racing to
      # create it. Confirmed necessary the hard way - v0.1.4 hit this twice,
      # once failing outright and once silently shipping a release with only
      # the blockmap and no actual installer.
      - name: Pre-create GitHub release (avoids electron-builder's parallel-upload race)
        shell: pwsh
        run: |
          # Must match the tag electron-builder itself publishes to, which it
          # derives from package.json's version - NOT github.ref_name. A tag
          # push always has ref_name == the tag (e.g. "v0.1.4"), so those
          # looked identical in testing, but a manual workflow_dispatch run
          # against a branch has ref_name == the branch (e.g. "master"),
          # which silently created a stray "master"-tagged release (and, on
          # GitHub's end, a "master" git tag right alongside the real branch
          # of the same name) that then stole /releases/latest out from under
          # the real v0.1.4 release and broke every installed client's
          # update check. Reading package.json directly instead makes this
          # correct regardless of what ref triggered the run.
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes ""
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run release:win
        env:
          # Auto-provided by GitHub Actions, scoped to this repo only via the
          # `permissions` block above - used solely to create the release and
          # upload the installer. Never embedded in the shipped app; that's a
          # separate token (NOCTIVAGO_UPDATE_TOKEN, see electron.vite.config.js).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo secret the user creates once (see CLAUDE.md) - a narrowly
          # scoped, read-only PAT baked into the app at build time so
          # electron-updater can check this private repo's releases from an
          # installed user's machine.
          NOCTIVAGO_UPDATE_TOKEN: ${{ secrets.NOCTIVAGO_UPDATE_TOKEN }}

      # Builds a SECOND, separate copy for itch.io - deliberately without
      # NOCTIVAGO_UPDATE_TOKEN set, so __UPDATE_TOKEN__ bakes in as an empty
      # string (electron.vite.config.js's own behavior for any build that
      # doesn't have the token in its env - the same as a plain local build).
      # This is not optional/paranoia: the GitHub-published build above HAS
      # that token baked in (a narrowly-scoped but still real read-access PAT
      # for this private repo), and itch.io is a public download page -
      # pushing the same token-bearing file there would let anyone who
      # downloads it extract a working credential and clone the private repo.
      # `--publish never` guarantees this pass can't touch GitHub at all, even
      # by accident (electron-builder.yml's own `publish:` block would
      # otherwise apply its default policy). Costs a few extra minutes of
      # build time per release; that's the trade for keeping the itch copy
      # genuinely secret-free rather than just "the same file, hope nobody
      # extracts it."
      - run: npm run build:itch:win

      # Keeps the itch.io page's download current on every release. Pushes
      # ONLY the token-free rebuild from the step above, never the
      # GitHub-published artifact. Unrelated to in-app auto-update
      # (electron-updater has no itch.io provider - it only ever checks
      # GitHub Releases, see above); this just refreshes the direct-download
      # copy itch already serves. Skips itself entirely (rather than failing
      # the whole run) until ITCH_BUTLER_API_KEY is added as a repo secret -
      # the GitHub Releases publish above is what update-checking actually
      # depends on and must keep working regardless of whether this is set
      # up yet.
      - name: Push token-free build to itch.io
        shell: pwsh
        env:
          # Butler reads this env var directly, no `butler login` needed -
          # the documented approach for CI. Account-wide, not scoped to this
          # one itch project (itch.io API keys can't be scoped narrower than
          # that) - unlike NOCTIVAGO_UPDATE_TOKEN, this key never ships
          # inside the app itself, only ever used here to push a file.
          BUTLER_API_KEY: ${{ secrets.ITCH_BUTLER_API_KEY }}
        run: |
          # Skip gracefully (not a failure) until the secret is added - the
          # GitHub Releases publish above is what update-checking actually
          # depends on and must succeed either way. Checked in the script,
          # not a workflow-level `if:`, to avoid any ambiguity about the
          # `secrets` context in step conditionals.
          if ([string]::IsNullOrEmpty($env:BUTLER_API_KEY)) {
            Write-Host "ITCH_BUTLER_API_KEY not set yet - skipping itch.io push."
            exit 0
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "dist" -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No .exe found in dist/ to push to itch.io"
            exit 1
          }
          Invoke-WebRequest -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" -OutFile "$env:RUNNER_TEMP\butler.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\butler.zip" -DestinationPath "$env:RUNNER_TEMP\butler"
          & "$env:RUNNER_TEMP\butler\butler.exe" push $installer.FullName venar1/noctivago:win --userversion $version
