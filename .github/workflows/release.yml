name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # electron-builder uploads the NSIS installer and its .blockmap as two
      # separate files in parallel, and each one independently checks
      # "does the GitHub release for this tag exist yet, if not create it."
      # When the release doesn't exist yet, both checks can land at the same
      # instant and both try to create it - GitHub accepts the first and
      # 422s the second ("already_exists"), which either kills the whole
      # publish step (losing whichever upload hadn't finished) or, worse,
      # silently drops that upload while electron-builder still exits 0.
      # Pre-creating the release here removes the race entirely: by the time
      # electron-builder's uploads run, the release unambiguously already
      # exists, so both just attach their file to it instead of racing to
      # create it. Confirmed necessary the hard way - v0.1.4 hit this twice,
      # once failing outright and once silently shipping a release with only
      # the blockmap and no actual installer.
      - name: Pre-create GitHub release (avoids electron-builder's parallel-upload race)
        shell: pwsh
        run: |
          # Must match the tag electron-builder itself publishes to, which it
          # derives from package.json's version - NOT github.ref_name. A tag
          # push always has ref_name == the tag (e.g. "v0.1.4"), so those
          # looked identical in testing, but a manual workflow_dispatch run
          # against a branch has ref_name == the branch (e.g. "master"),
          # which silently created a stray "master"-tagged release (and, on
          # GitHub's end, a "master" git tag right alongside the real branch
          # of the same name) that then stole /releases/latest out from under
          # the real v0.1.4 release and broke every installed client's
          # update check. Reading package.json directly instead makes this
          # correct regardless of what ref triggered the run.
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes ""
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run release:win
        env:
          # Auto-provided by GitHub Actions, scoped to this repo only via the
          # `permissions` block above - used solely to create the release and
          # upload the installer. Never embedded in the shipped app; that's a
          # separate token (NOCTIVAGO_UPDATE_TOKEN, see electron.vite.config.js).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo secret the user creates once (see CLAUDE.md) - a narrowly
          # scoped, read-only PAT baked into the app at build time so
          # electron-updater can check this private repo's releases from an
          # installed user's machine.
          NOCTIVAGO_UPDATE_TOKEN: ${{ secrets.NOCTIVAGO_UPDATE_TOKEN }}
