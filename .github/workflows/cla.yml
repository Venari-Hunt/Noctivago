name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# explicitly configured in case repository-wide workflow permissions are
# set to read-only - this workflow needs to comment, update PR status,
# and commit the signatures file back to the repo.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to a specific release of the community-maintained fork of
        # cla-assistant's GitHub Action (self-contained: signatures are
        # stored as a JSON file in this repo, no third-party service or
        # account involved). This project is archived/unmaintained upstream
        # but functionally stable for this narrow purpose - pinning a
        # specific version means it won't change under us either way.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/Venari-Hunt/Noctivago/blob/master/CLA.md"
          branch: "master"
          allowlist: Venari-Hunt,dependabot[bot]
