name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# explicitly configured in case repository-wide workflow permissions are
# set to read-only - this workflow needs to comment, update PR status,
# and commit the signatures file back to the repo.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to a specific release of the community-maintained fork of
        # cla-assistant's GitHub Action (self-contained: signatures are
        # stored as a JSON file in this repo, no third-party service or
        # account involved). This project is archived/unmaintained upstream
        # but functionally stable for this narrow purpose - pinning a
        # specific version means it won't change under us either way.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/Venari-Hunt/Noctivago/blob/master/CLA.md"
          # Deliberately NOT "master": this action commits the updated
          # signatures file straight to this branch via the GitHub Contents
          # API, with no status checks of its own. master requires the
          # "CLAAssistant"/"test" checks on every push, so that commit was
          # always rejected ("2 of 2 required status checks are expected")
          # and signatures/cla.json never actually recorded a signature -
          # confirmed by the file still reading `signedContributors: []`
          # after two real contributors had signed. cla-signatures is a
          # plain, unprotected branch that exists solely to hold this file.
          branch: "cla-signatures"
          # 'claude' is the account behind the "Co-Authored-By: Claude
          # Sonnet 5" trailer this project's commits carry - an attribution
          # line, not an independent outside contributor, so it doesn't need
          # its own CLA signature.
          allowlist: Venari-Hunt,dependabot[bot],claude
