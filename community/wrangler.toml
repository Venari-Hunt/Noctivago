name = "noctivago-community"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "noctivago-community"
database_id = "b46e46c9-a055-41a4-ac7f-c1f131e0eca5"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "noctivago-community"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   ADMIN_TOKEN  moderation token for the /v1/admin routes
#   IP_SALT      random string mixed into hashed client IPs
