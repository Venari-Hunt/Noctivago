<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Noctívago</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <span id="dev-badge" class="dev-badge hidden" title="This is a development build - separate data from any installed copy">DEV</span>
        <button id="global-play-pause" class="btn btn-primary" type="button">Play all</button>
        <label class="global-volume-label">
          Volume
          <input id="global-volume" type="range" min="0" max="100" value="100" class="global-volume" />
        </label>
        <span class="spacer"></span>
        <button id="open-presets" class="btn" type="button">Presets</button>
        <button id="open-settings" class="btn btn-icon" type="button" title="Settings">⚙</button>
        <div class="add-sound-menu-wrapper">
          <button id="add-sound" class="btn btn-icon" type="button" title="Add sound" aria-haspopup="true" aria-expanded="false">+</button>
          <div id="add-sound-menu" class="dropdown-menu hidden">
            <button id="add-sound-file" class="dropdown-item" type="button">Add file…</button>
            <button id="add-sound-folder-preset" class="dropdown-item" type="button">Add folder as preset…</button>
          </div>
        </div>
      </header>
      <nav id="tab-bar" class="tab-bar"></nav>
      <main id="tab-content"></main>
    </div>

    <div id="add-sound-dialog" class="modal hidden">
      <div class="modal-card">
        <h2>Add sound</h2>
        <label class="field-label">Name
          <input id="add-sound-name" type="text" />
        </label>
        <label class="checkbox-row">
          <input id="add-sound-keep-copy" type="checkbox" />
          Keep a copy in the app (safe if you move/delete the original — uses extra disk space)
        </label>
        <div class="modal-actions">
          <button id="add-sound-cancel" class="btn" type="button">Cancel</button>
          <button id="add-sound-confirm" class="btn btn-primary" type="button">Add</button>
        </div>
      </div>
    </div>

    <div id="add-folder-preset-dialog" class="modal hidden">
      <div class="modal-card">
        <h2>Add folder as preset</h2>
        <p class="modal-hint">Every audio file directly inside this folder will be added to your library and included together in a new preset.</p>
        <label class="field-label">Preset name
          <input id="add-folder-preset-name" type="text" />
        </label>
        <label class="checkbox-row">
          <input id="add-folder-preset-keep-copy" type="checkbox" />
          Keep copies in the app (safe if you move/delete the originals — uses extra disk space)
        </label>
        <p id="add-folder-preset-status" class="add-folder-preset-status"></p>
        <div class="modal-actions">
          <button id="add-folder-preset-cancel" class="btn" type="button">Cancel</button>
          <button id="add-folder-preset-confirm" class="btn btn-primary" type="button">Add</button>
        </div>
      </div>
    </div>

    <div id="presets-modal" class="modal hidden">
      <div class="modal-card">
        <h2>Presets</h2>
        <div class="preset-save-row">
          <input id="new-preset-name" type="text" placeholder="Preset name" />
          <button id="save-preset" class="btn btn-primary" type="button">Save current mix</button>
        </div>
        <p id="preset-save-hint" class="preset-save-hint"></p>
        <ul id="preset-list" class="preset-list"></ul>
        <div class="modal-actions">
          <button id="presets-close" class="btn" type="button">Close</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-card">
        <h2>Settings</h2>
        <label class="checkbox-row">
          <input id="settings-auto-update-enabled" type="checkbox" />
          Automatically check for updates
        </label>
        <div class="settings-row">
          <button id="settings-check-now" class="btn" type="button">Check for updates now</button>
          <span id="settings-check-status" class="settings-check-status"></span>
        </div>
        <div class="modal-actions">
          <button id="settings-close" class="btn" type="button">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
